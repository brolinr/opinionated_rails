title: opinionated_rails
description: Rails 8 app generator with tested options
url: https://brolinr.github.io
baseurl: /opinionated_rails
lang: en
author:
  name: Brolin Remunyanga

# SEO: rendered by jekyll-seo-tag (included by the theme's <head>); sitemap.xml by jekyll-sitemap
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

social:
  type: Organization
  name: opinionated_rails
  links:
    - https://github.com/brolinr/opinionated_rails
    - https://rubygems.org/gems/opinionated_rails

theme: just-the-docs
color_scheme: ruby
enable_copy_code_button: true

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub: https://github.com/brolinr/opinionated_rails
  RubyGems: https://rubygems.org/gems/opinionated_rails
aux_links_new_tab: true

footer_content: Released under the MIT License.

# Not site pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

# The theme still uses Sass APIs that Dart Sass has deprecated; hide that upstream noise.
sass:
  quiet_deps: true
  silence_deprecations: [ import, global-builtin, color-functions ]

# Every page uses the theme's default layout (index.md overrides it with `home`).
defaults:
  - scope:
      path: ""
    values:
      layout: default
      # jekyll-seo-tag reads these per page
      image:
        path: /assets/images/social-card.png
        width: 1200
        height: 630
        alt: "opinionated_rails: start a Rails app with your choices already made"
      twitter:
        card: summary_large_image
